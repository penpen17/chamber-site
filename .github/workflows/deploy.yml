# Automatic publishing to GitHub Pages.
# Every time you push to the "main" branch, GitHub builds the site (npm run build)
# and publishes the dist/ folder. You can follow it in the repository's "Actions" tab.
# Setup and explanation: notes/PUBLISH_GUIDE.md

name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # adds a "Run workflow" button in the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency: # only one deployment at a time
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # download the repository
      - uses: actions/setup-node@v4 # install Node.js
        with:
          node-version: 22
          cache: npm
      - run: npm ci # install the exact library versions from package-lock.json
      - run: npm run build # creates dist/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
